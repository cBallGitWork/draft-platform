# The approved-picture check, `look-approved`, which the `main` ruleset requires. approval_gate.py lists a pull
# request's layout differences from its approved picture and passes: layout waits for the UI reskin (Craig, 7 Nov
# 2026: "we can worry about design changes later in our ui reskin"). Before that a layout difference waited for
# the `craig-approved` label (5 Nov 2026). It fails only on an event it can't read, never a silent pass.
# pull_request, not pull_request_target: a check from pull_request_target lands on main's commit, never the pull
# request's head, so the ruleset couldn't count it.
name: look-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: look-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  look-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          sparse-checkout: .claude/hooks
      # The body and labels come from the event file GitHub writes, never from this file's expressions.
      - run: python3 .claude/hooks/approval_gate.py
