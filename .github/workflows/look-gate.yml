# The approved-picture gate as a GitHub check (CLAUDE.md: a pull request whose Approved vs built section numbers a
# layout difference, not just a look detail, waits for the `craig-approved` label only Craig adds). approval_gate.py holds the rule; the hooks stop
# only Claude's own gh merges, so a build's auto-merge went past it. The `main` ruleset requires `look-approved`, so
# no merge route skips it (Craig, 5 Nov 2026: "Yes, make it a check"). It runs again when the body is edited or a
# label goes on or off, so Craig's label turns it green without a push.
# pull_request, not pull_request_target: a check from pull_request_target lands on main's commit, never the pull
# request's head, so the ruleset couldn't count it. A pull request not by the repo's owner that edits this file or
# the hooks is never approved by lane-auto, so it can't loosen the gate that judges it.
name: look-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: look-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  look-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          sparse-checkout: .claude/hooks
      # The body and labels come from the event file GitHub writes, never from this file's expressions.
      - run: python3 .claude/hooks/approval_gate.py
