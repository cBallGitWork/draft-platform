# `npm run verify`, then `npm run build`, then `npm run smoke` in its own job, on GitHub's runner; what it catches and why here: ARCHITECTURE.md, Services.
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:  # a newer push to a pull request cancels its older run; every push to main gets its own run, so each merged commit is checked
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # origin/main and the branch's commits, for verify's recorded-payload check
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # the hook checks run on the runner's own bash, python3, git and /usr/bin/jq: say which
      - run: bash --version | head -1 && python3 --version && git --version && /usr/bin/jq --version
      - run: npm ci
      - run: npm run verify
      - run: npm run build  # the production bundle builds; verify never runs vite build

  # `npm run smoke`: the dev server and the production bundle loaded in Chromium, with no Convex
  # deployment (playwright.config.ts); its report and traces are kept when it fails.
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12  # the install step's 7 plus npm ci and smoke, so a double hang fails as that step, not as a cancel
    env:
      BROWSER: chromium  # the one browser CI installs for smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Why the cache and the cut-off: ARCHITECTURE.md, Services (#281).
      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright's browser from the cache
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.BROWSER }}-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The fresh runner always needs the OS packages; on a cache hit the browser is already there.
      - name: Install Chromium and its OS packages (download skipped on a cache hit; timed tries)
        timeout-minutes: 7  # TRIES x TRY_SECONDS, plus a minute
        env:
          TRIES: 2
          TRY_SECONDS: 180
          KILL_AFTER_SECONDS: 10
        run: |
          for try in $(seq "$TRIES"); do
            timeout --kill-after="$KILL_AFTER_SECONDS" "$TRY_SECONDS" npx playwright install --with-deps "$BROWSER" && exit 0
            echo "::warning::playwright install: try $try of $TRIES failed or ran past ${TRY_SECONDS}s"
          done
          exit 1
      - run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
