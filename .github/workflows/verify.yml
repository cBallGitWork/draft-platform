# The local gate (`npm run verify`) as one job, then `npm run build`, beside `npm run smoke`; what it catches and
# why here: ARCHITECTURE.md, Services. One job, one npm ci (Craig, 4 Nov 2026, after the tech-lead review: four
# jobs each ran their own npm ci).
# A pull request that changes only docs (docs/, spec/, .claude/, *.md) or the agents' prompt workflows runs the cheap
# checks and skips the unit tests, build and smoke. A merge to main runs nothing: a nightly run on main (and a manual
# one, from the Actions tab) runs all of it, the safety net for two merges that pass alone but clash together. A
# failed nightly run goes red on main's last commit and opens (or comments on) the `nightly-ci` issue. The jobs
# named `verify` and `smoke` are the results the ruleset requires; a skipped smoke is not a failure.
name: verify

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'  # 03:30 UTC, once a day
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # a newer push to a pull request cancels its older run; a nightly or manual run on main gets its own
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # code = any changed file outside docs/, spec/, .claude/, markdown and the agents' prompt workflows, which no
  # test, build or smoke run exercises (Craig, 4 Nov 2026: stop running CI all the time)
  NOT_CODE: '^(docs/|spec/|\.claude/)|\.md$|^\.github/workflows/(claude-build|nightly-build|review|drift-pass)\.yml$'

jobs:
  # what changed, and smoke's container tag; no npm ci
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      playwright_version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --no-renames --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qvE "$NOT_CODE"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      # smoke's container tag, read from the lockfile so the image's browsers match the Playwright npm ci installs
      - id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test']?.version ?? ''")
          [ -n "$version" ] || { echo "::error::package-lock.json names no @playwright/test version, so smoke has no container image"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # `npm run verify`'s steps and `npm run build`, quick failures first. It works out for itself whether code changed,
  # so a failed `changes` job can't skip it: a required job that is skipped would count as passed.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # origin/main and the branch's commits, for the recorded-payload and tests-kept checks
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
            || git diff --no-renames --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qvE "$NOT_CODE"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      # the hook checks run on the runner's own bash, python3, git and /usr/bin/jq: say which
      - run: bash --version | head -1 && python3 --version && git --version && /usr/bin/jq --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/recorded-add-only.mjs
      - run: node scripts/tests-kept.mjs
      - run: node scripts/spec-ids.mjs
      - run: node scripts/contents-lists.mjs
      - run: .claude/hooks/test.sh
      - if: steps.diff.outputs.code == 'true'
        run: npm test
      # the production bundle builds and holds no preview data; the unit tests never run vite build
      - if: steps.diff.outputs.code == 'true'
        run: npm run build

  # `npm run smoke`: the dev server and the production bundle loaded in Chromium, with no Convex
  # deployment (playwright.config.ts); its report and traces are kept when it fails.
  # Playwright's image has Chromium and its OS packages baked in, so no run installs from apt,
  # which failed about one run in four (#372). It runs when `changes` failed too, so it goes red rather than
  # being skipped (a skipped required job counts as passed).
  smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright_version }}-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # a failed nightly run says so in an issue, beside the red mark on main, so nobody has to open the Actions tab
  nightly-alert:
    if: >-
      always() && github.event_name == 'schedule'
      && (needs.verify.result != 'success' || (needs.smoke.result != 'success' && needs.smoke.result != 'skipped'))
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_LABEL: nightly-ci
        run: |
          body="The nightly CI run on main failed: $RUN_URL"
          gh label create "$ALERT_LABEL" --color B60205 --description "the nightly CI run on main failed" --force
          open=$(gh issue list --label "$ALERT_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly CI failed on main" --label "$ALERT_LABEL" --body "$body"
          fi
