# The gate, on GitHub's runner: every pull request to main and every push to main runs
# `npm run verify` (tests, typecheck, hook checks), so two pull requests that pass alone but
# break main together are caught on main. No secrets: the tests use convex-test and recorded
# payloads, never a deployment.
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:  # a newer push to a pull request replaces its older run; main's runs all finish
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # the hook checks run on the runner's own python3, git and /usr/bin/jq: say which
      - run: python3 --version && git --version && /usr/bin/jq --version
      - run: npm ci
      - run: npm run verify
