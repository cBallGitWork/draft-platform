# The local gate (`npm run verify`) split into jobs that run side by side: `checks` (types, lint, the scripts checks,
# the hooks, actionlint), `unit` (`npm test` in vitest shards) and `build`; beside them `npm run smoke`. What it catches and why
# here: ARCHITECTURE.md, Services. Split again to halve a PR's wait (about 4 min as one job, 5 Nov 2026).
# A pull request that changes only docs (docs/, spec/, .claude/, *.md) or the agents' prompt workflows runs the cheap
# checks and skips the unit tests and build; smoke runs only when the PR touches what the browser loads (src/,
# index.html, vite.config*, package*.json, public/). A merge to main runs nothing: a nightly run on main (and a manual
# one, from the Actions tab) runs all of it, the safety net for two merges that pass alone but clash together. A
# failed nightly run goes red on main's last commit and opens (or comments on) the `nightly-ci` issue. The jobs
# named `verify` and `smoke` are the results the ruleset requires: `verify` fails when any job it waits on failed,
# and a skipped job is not a failure.
name: verify

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'  # 03:30 UTC, once a day
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # a newer push to a pull request cancels its older run; a nightly or manual run on main gets its own
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # code = any changed file outside docs/, spec/, .claude/, markdown and the agents' prompt workflows, which no
  # test, build or smoke run exercises (Craig, 4 Nov 2026: stop running CI all the time)
  NOT_CODE: '^(docs/|spec/|\.claude/)|\.md$|^\.github/workflows/(claude-build|lead|review|review-gate|drift-pass)\.yml$'
  # what the browser loads, so what smoke exercises
  SMOKE_PATHS: '^(src/|public/|index\.html$|vite\.config|package(-lock)?\.json$)'
  UNIT_SHARDS: 3  # keep in step with the `shard` matrix below
  # actionlint checks every workflow, and the shell in its `run:` blocks through shellcheck, at warning and above (an
  # info note like SC2016 is often meant). On 9 Nov 2026 #1371 merged an apostrophe that ended a single-quoted jq
  # program, and every lead pass died until #1372. Pinned, and its download checked against the release's checksum.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  # its linux_amd64 tarball
  SHELLCHECK_OPTS: --severity=warning

jobs:
  # what changed, and smoke's container tag; no npm ci
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      smoke: ${{ steps.diff.outputs.smoke }}
      playwright_version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            { echo "code=true"; echo "smoke=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --no-renames --name-only "origin/$GITHUB_BASE_REF...HEAD")
          if echo "$changed" | grep -qvE "$NOT_CODE"; then code=true; else code=false; fi
          if echo "$changed" | grep -qE "$SMOKE_PATHS"; then smoke=true; else smoke=false; fi
          { echo "code=$code"; echo "smoke=$smoke"; } >> "$GITHUB_OUTPUT"
      # smoke's container tag, read from the lockfile so the image's browsers match the Playwright npm ci installs
      - id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test']?.version ?? ''")
          [ -n "$version" ] || { echo "::error::package-lock.json names no @playwright/test version, so smoke has no container image"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # types and lint, the checks that read git history, and the hooks: every run, docs-only too
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # origin/main and the branch's commits, for the recorded-payload and tests-kept checks
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # the hook checks run on the runner's own bash, python3, git and /usr/bin/jq: say which
      - run: bash --version | head -1 && python3 --version && git --version && /usr/bin/jq --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/recorded-add-only.mjs
      - run: node scripts/tests-kept.mjs
      - run: node scripts/spec-ids.mjs
      - run: node scripts/contents-lists.mjs
      - run: .claude/hooks/test.sh
      - name: actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          shellcheck --version | sed -n 2p
          ./actionlint -color

  # `npm test`, split across runners: vitest's own shards, so every test file runs in exactly one of them
  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/${{ env.UNIT_SHARDS }}

  # the production bundle builds and holds no preview data; the unit tests never run vite build
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # the one result the ruleset requires for all of the above: red when any job it waits on failed or was cancelled
  # (a failed `changes` skips unit and build but is itself a failure here); a skipped job is fine
  verify:
    needs: [changes, checks, unit, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job verify waits on ended $r"; exit 1 ;;
            esac
          done

  # `npm run smoke`: the dev server and the production bundle loaded in Chromium, with no Convex
  # deployment (playwright.config.ts); its report and traces are kept when it fails.
  # Playwright's image has Chromium and its OS packages baked in, so no run installs from apt,
  # which failed about one run in four (#372). It is skipped (which passes the required check) unless the PR touches
  # SMOKE_PATHS; it runs when `changes` failed too, so it goes red rather than being skipped.
  smoke:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.smoke == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright_version }}-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # a failed nightly run says so in an issue, beside the red mark on main, so nobody has to open the Actions tab
  nightly-alert:
    if: >-
      always() && github.event_name == 'schedule'
      && (needs.verify.result != 'success' || (needs.smoke.result != 'success' && needs.smoke.result != 'skipped'))
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_LABEL: nightly-ci
        run: |
          body="The nightly CI run on main failed: $RUN_URL"
          gh label create "$ALERT_LABEL" --color B60205 --description "the nightly CI run on main failed" --force
          open=$(gh issue list --label "$ALERT_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly CI failed on main" --label "$ALERT_LABEL" --body "$body"
          fi
