# The local gate (`npm run verify`) split into jobs that run side by side, then `npm run build` and `npm run smoke`;
# what it catches and why here: ARCHITECTURE.md, Services.
# A pull request that changes only docs (docs/, spec/, .claude/, *.md) runs the cheap checks and skips the
# unit tests, build and smoke. A merge to main runs nothing: a nightly run on main (and a manual one, from the
# Actions tab) runs all of it, the safety net for two merges that pass alone but clash together. A failed nightly
# run goes red on main's last commit and opens (or comments on) the `nightly-ci` issue. The job named `verify` is
# the one result the ruleset requires (with `smoke`): it fails when any job it waits on failed, and a skipped job
# is not a failure.
name: verify

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'  # 03:30 UTC, once a day
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # a newer push to a pull request cancels its older run; a nightly or manual run on main gets its own
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UNIT_SHARDS: 3  # keep in step with the `shard` matrix below

jobs:
  # what changed, and smoke's container tag
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      playwright_version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # code = any changed file outside docs/, spec/, .claude/, markdown and the agents' prompt workflows, which no
          # test, build or smoke run exercises (Craig, 4 Nov 2026: stop running CI all the time)
          if git diff --no-renames --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qvE '^(docs/|spec/|\.claude/)|\.md$|^\.github/workflows/(claude-build|analyst|nightly-build)\.yml$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      # smoke's container tag, read from the lockfile so the image's browsers match the Playwright npm ci installs
      - id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test']?.version ?? ''")
          [ -n "$version" ] || { echo "::error::package-lock.json names no @playwright/test version, so smoke has no container image"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # the quick failures first: types and lint stop a run before the unit tests and build spend their minutes
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # the checks that read git history and the hooks; they run beside the slow jobs, not in front of them
  checks:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # origin/main and the branch's commits, for the recorded-payload and tests-kept checks
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # the hook checks run on the runner's own bash, python3, git and /usr/bin/jq: say which
      - run: bash --version | head -1 && python3 --version && git --version && /usr/bin/jq --version
      - run: npm ci
      - run: node scripts/recorded-add-only.mjs
      - run: node scripts/tests-kept.mjs
      - run: node scripts/spec-ids.mjs
      - run: node scripts/contents-lists.mjs
      - run: .claude/hooks/test.sh

  # `npm test`, split across runners: vitest's own shards, so every test file runs in exactly one of them
  unit:
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/${{ env.UNIT_SHARDS }}

  # the production bundle builds and holds no preview data; the unit tests never run vite build
  build:
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # `npm run smoke`: the dev server and the production bundle loaded in Chromium, with no Convex
  # deployment (playwright.config.ts); its report and traces are kept when it fails.
  # Playwright's image has Chromium and its OS packages baked in, so no run installs from apt,
  # which failed about one run in four (#372). It waits only for `changes` (its container tag), not for lint.
  smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright_version }}-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # the result the ruleset requires: it runs whatever happened above, and a skipped job is fine
  verify:
    if: always()
    needs: [changes, lint, checks, unit, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a job did not pass"; exit 1 ;;
          esac

  # a failed nightly run says so in an issue, beside the red mark on main, so nobody has to open the Actions tab
  nightly-alert:
    if: failure() && github.event_name == 'schedule'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_LABEL: nightly-ci
        run: |
          body="The nightly CI run on main failed: $RUN_URL"
          gh label create "$ALERT_LABEL" --color B60205 --description "the nightly CI run on main failed" --force
          open=$(gh issue list --label "$ALERT_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly CI failed on main" --label "$ALERT_LABEL" --body "$body"
          fi
